<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search laptop chips and learn what common model suffixes mean." />
    <title>Laptop Chip Database</title>
    <style>
      :root { color-scheme: dark; --bg: #090d14; --panel: #111824; --line: #263244; --text: #edf4ff; --muted: #9eabc0; --accent: #65d6ad; --blue: #79aef2; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top left, #17243a 0, var(--bg) 42rem); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(1080px, calc(100% - 2rem)); margin: auto; padding: 3rem 0; }
      .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .16em; font-size: .75rem; font-weight: 800; }
      h1 { margin: .4rem 0; font-size: clamp(2rem, 7vw, 4rem); line-height: 1.05; }
      h2 { margin: 0; font-size: 1.2rem; }
      .muted, .note { color: var(--muted); }
      .controls { display: grid; grid-template-columns: 1fr 180px; gap: 1rem; padding: 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
      label { display: block; margin-bottom: .4rem; color: var(--muted); font-size: .85rem; }
      input, select { width: 100%; height: 46px; padding: 0 .8rem; color: var(--text); background: #0b111b; border: 1px solid var(--line); border-radius: 9px; font: inherit; }
      .count { color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1rem; }
      article { padding: 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
      .badge { display: inline-block; margin-bottom: .6rem; padding: .2rem .55rem; background: #1c3040; border-radius: 999px; color: var(--accent); font-size: .75rem; font-weight: 700; }
      article p { margin-bottom: 0; color: var(--muted); }
      .glossary { margin-top: 3.5rem; }
      .glossary .grid { margin-top: 1rem; }
      .suffix { color: var(--blue); font-weight: 800; }
      @media (max-width: 600px) { main { padding-top: 2rem; } .controls { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Open hardware data</p>
        <h1>Laptop Chip Database</h1>
        <p class="muted">Look up laptop processors and graphics chips, and learn what common model labels mean.</p>
      </header>

      <section class="controls" aria-label="Chip search">
        <div><label for="search">Search chips</label><input id="search" type="search" placeholder="Try Ryzen 7 7840U" autocomplete="off" /></div>
        <div><label for="type">Chip type</label><select id="type"><option value="all">All chips</option><option>CPU</option><option>GPU</option></select></div>
      </section>
      <p id="count" class="count" aria-live="polite"></p>
      <section id="chips" class="grid" aria-label="Chip results"></section>

      <section class="glossary" aria-labelledby="glossary-title">
        <p class="eyebrow">Model-name guide</p>
        <h2 id="glossary-title">Common laptop chip suffixes</h2>
        <p class="note">Suffix meanings vary between manufacturers and generations. Check the full model against its official specifications.</p>
        <div id="suffixes" class="grid"></div>
      </section>
    </main>
    <script>
      const chips = [
        { name: "AMD Ryzen 3 7330U", type: "CPU", maker: "AMD", specs: "4 cores / 8 threads · Zen 3 · 15–30W · 2023" },
        { name: "AMD Ryzen 5 7535U", type: "CPU", maker: "AMD", specs: "6 cores / 12 threads · Zen 3+ · 15–30W · 2023" },
        { name: "AMD Ryzen 5 7640U", type: "CPU", maker: "AMD", specs: "6 cores / 12 threads · Zen 4 · 15–30W · 2023" },
        { name: "AMD Ryzen 7 7840U", type: "CPU", maker: "AMD", specs: "8 cores / 16 threads · Zen 4 · 15–30W · 2023" },
        { name: "AMD Ryzen 7 8840U", type: "CPU", maker: "AMD", specs: "8 cores / 16 threads · Zen 4 · Ryzen AI · 2023" },
        { name: "AMD Ryzen 9 7940HS", type: "CPU", maker: "AMD", specs: "8 cores / 16 threads · Zen 4 · slim performance · 2023" },
        { name: "AMD Ryzen 9 7945HX", type: "CPU", maker: "AMD", specs: "16 cores / 32 threads · Zen 4 · high-performance · 2023" },
        { name: "AMD Ryzen AI 9 HX 370", type: "CPU", maker: "AMD", specs: "12 cores / 24 threads · Zen 5 · NPU · 2024" },

        { name: "Intel Core i5-1335U", type: "CPU", maker: "Intel", specs: "10 cores / 12 threads · Raptor Lake · U series · 2023" },
        { name: "Intel Core i7-1360P", type: "CPU", maker: "Intel", specs: "12 cores / 16 threads · Raptor Lake · P series · 2023" },
        { name: "Intel Core i7-13700H", type: "CPU", maker: "Intel", specs: "14 cores / 20 threads · Raptor Lake · H series · 2023" },
        { name: "Intel Core i9-13980HX", type: "CPU", maker: "Intel", specs: "24 cores / 32 threads · Raptor Lake · HX series · 2023" },
        { name: "Intel Core Ultra 5 125H", type: "CPU", maker: "Intel", specs: "14 cores / 18 threads · Meteor Lake · NPU · 2023" },
        { name: "Intel Core Ultra 7 155H", type: "CPU", maker: "Intel", specs: "16 cores / 22 threads · Meteor Lake · NPU · 2023" },
        { name: "Intel Core Ultra 9 185H", type: "CPU", maker: "Intel", specs: "16 cores / 22 threads · Meteor Lake · NPU · 2023" },
        { name: "Intel Core Ultra 7 258V", type: "CPU", maker: "Intel", specs: "8 cores / 8 threads · Lunar Lake · NPU · 2024" },

        { name: "Apple M1", type: "CPU", maker: "Apple", specs: "8-core CPU · 8-core GPU options · unified memory · 2020" },
        { name: "Apple M2", type: "CPU", maker: "Apple", specs: "8-core CPU · 8–10-core GPU · unified memory · 2022" },
        { name: "Apple M3", type: "CPU", maker: "Apple", specs: "8-core CPU · 8–10-core GPU · unified memory · 2023" },
        { name: "Apple M3 Pro", type: "CPU", maker: "Apple", specs: "11–12-core CPU · 14–18-core GPU · unified memory · 2023" },
        { name: "Apple M3 Max", type: "CPU", maker: "Apple", specs: "14–16-core CPU · 30–40-core GPU · unified memory · 2023" },
        { name: "Apple M4", type: "CPU", maker: "Apple", specs: "Up to 10-core CPU · up to 10-core GPU · unified memory · 2024" },
        { name: "Apple M4 Pro", type: "CPU", maker: "Apple", specs: "12–14-core CPU · up to 20-core GPU · unified memory · 2024" },
        { name: "Apple M4 Max", type: "CPU", maker: "Apple", specs: "14–16-core CPU · up to 40-core GPU · unified memory · 2024" },

        { name: "Qualcomm Snapdragon X Plus X1P-64-100", type: "CPU", maker: "Qualcomm", specs: "10 cores · Hexagon NPU · Arm · 2024" },
        { name: "Qualcomm Snapdragon X Elite X1E-84-100", type: "CPU", maker: "Qualcomm", specs: "12 cores · Hexagon NPU · Arm · 2024" },

        { name: "MediaTek Kompanio 1380", type: "CPU", maker: "MediaTek", specs: "Octa-core Arm · ARM G57 MC5 GPU · Chromebook/education · 2022" },

        { name: "NVIDIA GeForce RTX 4050 Laptop", type: "GPU", maker: "NVIDIA", specs: "2560 CUDA cores · Ada Lovelace · laptop TGP varies · 2023" },
        { name: "NVIDIA GeForce RTX 4060 Laptop", type: "GPU", maker: "NVIDIA", specs: "3072 CUDA cores · Ada Lovelace · laptop TGP varies · 2023" },
        { name: "NVIDIA GeForce RTX 4070 Laptop", type: "GPU", maker: "NVIDIA", specs: "4608 CUDA cores · Ada Lovelace · laptop TGP varies · 2023" },
        { name: "NVIDIA GeForce RTX 4080 Laptop", type: "GPU", maker: "NVIDIA", specs: "7424 CUDA cores · Ada Lovelace · laptop TGP varies · 2023" },
        { name: "NVIDIA GeForce RTX 4090 Laptop", type: "GPU", maker: "NVIDIA", specs: "9728 CUDA cores · Ada Lovelace · laptop TGP varies · 2023" },

        { name: "AMD Radeon 660M", type: "GPU", maker: "AMD", specs: "6 compute units · RDNA 2 · integrated graphics · 2022" },
        { name: "AMD Radeon 780M", type: "GPU", maker: "AMD", specs: "12 compute units · RDNA 3 · integrated graphics · 2023" },
        { name: "AMD Radeon 890M", type: "GPU", maker: "AMD", specs: "16 compute units · RDNA 3.5 · integrated graphics · 2024" },
        { name: "AMD Radeon RX 7600S", type: "GPU", maker: "AMD", specs: "28 compute units · RDNA 3 · discrete laptop GPU · 2023" },
        { name: "AMD Radeon RX 7700S", type: "GPU", maker: "AMD", specs: "32 compute units · RDNA 3 · discrete laptop GPU · 2023" },

        { name: "Intel Iris Xe 96EU", type: "GPU", maker: "Intel", specs: "96 execution units · Tiger Lake architecture · integrated · 2021" },
        { name: "Intel Arc A730M", type: "GPU", maker: "Intel", specs: "24 Xe cores · discrete laptop GPU · 2022" },
        { name: "Intel Arc A770M", type: "GPU", maker: "Intel", specs: "32 Xe cores · discrete laptop GPU · 2022" },
        { name: "Intel Arc 140V", type: "GPU", maker: "Intel", specs: "8 Xe cores · Lunar Lake integrated graphics · 2024" },

        { name: "Qualcomm Adreno X1-85", type: "GPU", maker: "Qualcomm", specs: "Integrated Snapdragon X Elite GPU · 2024" }
      ];
      const suffixes = [
        ["AMD", "U", "Usually an efficiency-oriented Ryzen laptop processor class. Exact power limits depend on the chip and laptop."],
        ["AMD", "HS", "Performance-oriented mobile class often used in relatively slim laptops; not a fixed wattage guarantee."],
        ["AMD", "H", "Higher-performance mobile processor class, typically found in performance laptops."],
        ["AMD", "HX", "Enthusiast/high-performance mobile class. Check the exact SKU and laptop power configuration."],
        ["AMD", "PRO", "Business-oriented features such as security and manageability; not a power class."],
        ["AMD", "AI", "Ryzen AI branding for processors with an NPU in applicable generations."],
        ["Intel", "U", "Generally an efficiency-oriented laptop processor class. Power varies by generation and device."],
        ["Intel", "P", "Performance-oriented thin-laptop class used in selected Intel generations."],
        ["Intel", "H", "Higher-performance laptop processor class, common in performance and creator laptops."],
        ["Intel", "HX", "High-performance laptop class, often used in gaming and workstation laptops."],
        ["Intel", "V", "Series marker in selected Core Ultra model numbers, such as Lunar Lake; not a universal suffix definition."],
        ["NVIDIA", "Max-Q", "Efficiency-focused laptop design branding and technologies; not a separate GPU model or fixed wattage."],
        ["NVIDIA", "Ti", "Usually marks a higher-performance variant within a GPU family; the difference varies by generation."],
        ["NVIDIA", "SUPER", "Refresh or higher-tier variant in selected GPU generations."],
        ["Apple", "Pro / Max / Ultra", "Apple silicon product tiers. Capabilities and configurations vary by chip generation."],
        ["Qualcomm", "X Elite / X Plus", "Snapdragon X laptop processor tiers. Compare the full SKU for core count and features."],
        ["AMD", "XT", "May mark a higher-performance or refreshed Radeon/desktop variant; meaning varies by product family."],
        ["Intel", "F", "Usually means no enabled integrated graphics and requires a discrete GPU in applicable processor families."],
        ["Intel", "K", "Unlocked processor designation, primarily for desktop models or enthusiast platforms."],
        ["Intel", "X / XE", "High-end or extreme desktop/workstation branding in some Intel families; not a standard laptop class."]
      ];
      const search = document.querySelector("#search");
      const type = document.querySelector("#type");
      const chipList = document.querySelector("#chips");
      const count = document.querySelector("#count");
      function renderChips() {
        const query = search.value.trim().toLowerCase();
        const results = chips.filter((chip) => (type.value === "all" || chip.type === type.value) && `${chip.name} ${chip.maker} ${chip.specs}`.toLowerCase().includes(query));
        count.textContent = `${results.length} chip${results.length === 1 ? "" : "s"} found`;
        chipList.innerHTML = results.length ? results.map((chip) => `<article><span class="badge">${chip.type} · ${chip.maker}</span><h2>${chip.name}</h2><p>${chip.specs}</p></article>`).join("") : '<p class="note">No chips match that search.</p>';
      }
      document.querySelector("#suffixes").innerHTML = suffixes.map(([maker, suffix, meaning]) => `<article><span class="badge">${maker}</span><h2 class="suffix">${suffix}</h2><p>${meaning}</p></article>`).join("");
      search.addEventListener("input", renderChips);
      type.addEventListener("change", renderChips);
      renderChips();
    </script>
  </body>
</html>
